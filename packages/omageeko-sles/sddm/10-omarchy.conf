# omageeko-sles: upstream Omarchy's SDDM setup (etc/sddm.conf.d/10-wayland.conf) plus the
# theme choice: the Wayland greeter runs in a minimal Hyprland, with the Omarchy theme.
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hyprland.lua

[Theme]
Current=omarchy
